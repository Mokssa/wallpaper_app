[package]
name = "wallpaper_app"
version = "0.1.0"
edition = "2021"
description = "A modern Windows wallpaper app built with Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wallpaper = "3.2"
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
directories = "5.0"
chrono = "0.4"
