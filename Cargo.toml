[package]
name = "wallpaper_app"
version = "0.1.0"
edition = "2021"
description = "A modern WinUI 3 style Windows wallpaper app built with Tauri v2 and Rust"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["image-ico", "image-png", "tray-icon"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
winreg = "0.55"
chrono = "0.4"
urlencoding = "2.1"
rfd = "0.15"
base64 = "0.22"
window-vibrancy = "0.5"
auto-launch = "0.5"
