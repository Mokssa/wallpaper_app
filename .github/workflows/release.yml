name: Release & Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Wallpaper ${{ github.ref_name }}'
          releaseBody: |
            ## 🌟 Wallpaper ${{ github.ref_name }} 发布

            ### 📦 下载安装
            请在下方 Assets 区域下载对应安装包：
            - **便携绿色版 (.zip)**：解压即用，免安装，适合随身携带或不想写入注册表的用户。
            - **NSIS 安装程序 (.exe)**：推荐普通用户下载使用，支持自动安装向导。
            - **MSI 安装包 (.msi)**：适用于 Windows 企业及批量部署。

            ---
            *由 GitHub Actions 自动化构建并发布。*
          releaseDraft: false
          prerelease: false

      - name: Package Portable Zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq "main") {
            $tag = "portable"
          }
          mkdir -p dist_portable
          Copy-Item "target/release/wallpaper_app.exe" -Destination "dist_portable/Wallpaper.exe"
          $zipName = "Wallpaper_${tag}_x64_portable.zip"
          Compress-Archive -Path "dist_portable/*" -DestinationPath $zipName -Force
          Write-Host "Created portable archive: $zipName"

      - name: Upload Portable Assets to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Wallpaper_${tag}_x64_portable.zip"
          if (Test-Path $zipName) {
            gh release upload $tag $zipName --clobber
            Write-Host "Uploaded $zipName to release $tag"
          }

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-windows-bundles
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/wallpaper_app.exe
            *.zip
          if-no-files-found: warn
