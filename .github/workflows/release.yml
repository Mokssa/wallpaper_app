name: Release & Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Wallpaper ${{ github.ref_name }}'
          releaseBody: |
            ## 🌟 Wallpaper ${{ github.ref_name }} 发布

            ### 📦 下载安装
            请在下方 Assets 区域下载对应安装包：
            - **NSIS 安装程序 (.exe)**：推荐普通用户下载使用，支持自动安装向导。
            - **MSI 安装包 (.msi)**：适用于 Windows 企业及批量部署。

            ---
            *由 GitHub Actions 自动化构建并发布。*
          releaseDraft: false
          prerelease: false

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-windows-bundles
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/wallpaper_app.exe
          if-no-files-found: warn
